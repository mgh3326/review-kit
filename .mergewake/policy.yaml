version: 1
# Operator 2026-11-02: review-kit joins the mergewake daemon; auto-merge (land) on.
enabled: true
required_checks:
  - test (ubuntu-latest, 3.12)
  - test (ubuntu-latest, 3.14)
  - test (macos-latest, 3.12)
  - test (macos-latest, 3.14)
  - test (windows-latest, 3.12)
  - test (windows-latest, 3.14)
blocking:
  - paths: ['.github/workflows/**', '.mergewake/**', 'pyproject.toml', 'setup.py']
    reason: Verification, packaging and policy changes can bypass recovery controls.
review_gate:
  land: graded
fast_lane:
  max_changed_lines: 50

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "review-kit"
version = "1.0.0"
description = "Prepare, package and share traceable review material"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "review-kit contributors"}]
keywords = ["ffmpeg", "video", "review", "sharing", "mp4"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Video :: Conversion",
]
# Runtime uses the Python standard library only; FFmpeg/ffprobe are external
# binaries that must be installed separately and are never bundled.
dependencies = []

[project.scripts]
prep-video = "prep_video:main"
review-kit = "review_kit.cli:main"

[tool.setuptools]
py-modules = ["prep_video"]
packages = ["review_kit"]
